services:
  api:
    build:
      context: .
      target: api
    ports:
      # Expose the ACL API only on the VPS loopback interface.
      # Access from the local workstation is expected through the SSH tunnel:
      #   localhost:18000 -> VPS localhost:18000 -> container:8000
      - "127.0.0.1:18000:8000"
    environment:
      # Explicit, non-secret local storage configuration (both variables are
      # already supported by src/audio_cue_locator/interfaces/rest_api/app.py
      # and default to these same relative paths; restated here so the
      # runtime's configuration is explicit rather than implicit).
      AUDIO_CUE_LOCATOR_ASSET_STORAGE_ROOT: var/asset_storage
      AUDIO_CUE_LOCATOR_ANALYSIS_DB_PATH: var/analysis_repository.sqlite3
    volumes:
      # Named volume, not a host bind mount: keeps local SQLite/filesystem
      # persistence local-first without writing runtime data into the
      # repository working tree.
      - api-data:/app/var

  webui:
    build:
      context: .
      target: webui
    ports:
      # Expose the ACL WebUI only on the VPS loopback interface.
      # Access from the local workstation is expected through the SSH tunnel:
      #   localhost:18081 -> VPS localhost:18081 -> container:80
      - "127.0.0.1:18081:80"
    volumes:
      # Effective Nginx server configuration for this service (S0001): the
      # supported Compose runtime uses this file instead of the Dockerfile's
      # embedded fallback, so the /api/v1/ proxy does not impose its own
      # upload-size ceiling. Read-only: this container never writes to it.
      - ./webui/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      # Waits for the `api` image's own HEALTHCHECK (Dockerfile) to report
      # healthy before starting, since the WebUI's static build calls
      # `/api/v1` through this container's own reverse proxy.
      api:
        condition: service_healthy

volumes:
  api-data: