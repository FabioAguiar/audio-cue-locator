# Effective Nginx server configuration for the Compose `webui` service
# (S0001). Mounted by compose.yaml at /etc/nginx/conf.d/default.conf,
# replacing the Dockerfile-embedded fallback used only when this image runs
# outside the supported Compose topology.
#
# The /api/v1/ location intentionally carries no product-level request-body
# ceiling and does not buffer the proxied request: ACL's own bounded
# REST/Application upload handling (AUDIO_CUE_LOCATOR_MAX_SOURCE_MEDIA_
# UPLOAD_BYTES / AUDIO_CUE_LOCATOR_MAX_CUE_UPLOAD_BYTES) remains the sole
# product-policy enforcement boundary for upload size; this file must never
# duplicate those byte values.
server {
    listen 80;
    server_name _;

    location /api/v1/ {
        proxy_pass http://api:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        client_max_body_size 0;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
